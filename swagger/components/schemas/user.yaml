type: object
required:
  - name
  - email
  - _id
properties:
  name:
    description: "User's name"
    type: string
    example: 'Charlie Big'
  email:
    description: "User's email"
    type: string
    example: 'charlie.big@example.com'
  _id:
    description: "User's ID"
    type: string
    example: 63e4decdd286j31165d54af5
