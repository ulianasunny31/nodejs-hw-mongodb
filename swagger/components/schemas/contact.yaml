type: object
required:
  - _id
  - name
  - phoneNumber
  - email
  - contactType
  - isFavourite
  - userId
  - photo
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contact's name"
    type: string
    example: 'Michael Moon'
  phoneNumber:
    description: "Contact's phone number"
    type: string
    example: '+1234567890'
  email:
    description: "Contact's email"
    type: string
    example: 'michael.moon@example.com'
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'personal', 'home']
  isFavourite:
    description: 'Whether the contact is favourite or not'
    type: boolean
    example: true
  photo:
    description: "Contact's photo"
    type: string
    example: https://res.cloudinary.com/dwiyluky8/image/upload/v1743351385/mgdgl1qewawzifnkk6bt.jpg
