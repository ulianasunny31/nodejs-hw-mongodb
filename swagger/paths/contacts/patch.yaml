tags:
  - Contacts
summary: Patch contact
operationId: patchContact
description: 'Edit contact. Everything is optional'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'Michael Moon'
          email:
            description: "Contact's email"
            type: string
            example: 'michael.moon@example.com'
          phoneNumber:
            description: "Contact's phone number"
            type: string
            example: '+1234567890'
          contactType:
            description: "Contact's type"
            type: string
            enum: ['work', 'home', 'personal']
          isFavourite:
            description: 'Whether the contact is favourite or not'
            type: boolean
            example: true
          photo:
            description: "Contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: 'Successfully created contact'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created a contact!'
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
