tags:
  - Auth
summary: Refresh user
operationId: refreshUser
description: 'Refresh a user'
security: []
responses:
  '200':
    description: 'Successfully refreshed in a user!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully refreshed in a user!'
            data:
              type: object
              required:
                - accessToken
              properties:
                accessToken:
                  type: string
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cHt56Frsh89fjj31g3jv8sn84nd'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
